<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCREEN95</title><style>*{box-sizing:border-box}body{margin:0;background:#008080;font:14px 'MS Sans Serif',Tahoma,sans-serif;color:#111}.window{height:100dvh;min-height:260px;background:silver;border:3px outset white;display:flex;flex-direction:column}.bar{background:navy;color:white;font-weight:bold;padding:5px 7px;display:flex;justify-content:space-between}.controls{padding:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select{background:#c0c0c0;border:2px outset white;padding:4px 8px;font:inherit;cursor:pointer}button:active{border-style:inset}canvas{display:block;width:100%;height:100%;background:black}.stage{flex:1;min-height:120px;border:3px inset #eee;position:relative;overflow:hidden}.status{padding:4px 8px;font-size:12px}label{display:flex;align-items:center;gap:5px}</style><div class="window"><div class="bar"><span>▣ SCREEN95.EXE — Screen Saver</span><span>_ □ ×</span></div><div class="controls"><label>Mode <select id="mode"><option value="dvd">Bouncing Logo</option><option value="stars">Starfield</option><option value="pipes">3D-ish Pipes</option><option value="toasters">Flying Toasters</option></select></label><label>Speed <input id="speed" type="range" min="1" max="5" value="2"></label><button id="pause">Pause</button><button id="full">Fullscreen</button></div><div class="stage" id="stage"><canvas id="screen"></canvas></div><div class="status">READY · Classic 90s-inspired screensaver · no sound</div></div><script>const c=document.getElementById('screen'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),mode=document.getElementById('mode'),speed=document.getElementById('speed');let w=1,h=1,paused=false,frame=0,logo={x:25,y:25,vx:2,vy:1.6,color:0},stars=[],pipes=[],toasters=[];function reset(){stars=Array.from({length:120},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1+.1}));pipes=[];toasters=Array.from({length:9},(_,i)=>({x:Math.random()*w,y:Math.random()*h,phase:i}));ctx.fillStyle='black';ctx.fillRect(0,0,w,h)}function resize(){let r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=Math.max(100,r.width);h=Math.max(100,r.height);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);reset()}new ResizeObserver(resize).observe(stage);mode.onchange=reset;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()};function loop(){requestAnimationFrame(loop);if(paused)return;frame++;let v=+speed.value;switch(mode.value){case'dvd':ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);logo.x+=logo.vx*v/2;logo.y+=logo.vy*v/2;if(logo.x<0||logo.x>w-115){logo.vx*=-1;logo.color++}if(logo.y<0||logo.y>h-52){logo.vy*=-1;logo.color++}ctx.fillStyle=['#00ffff','#ff55ff','#ffff33','#66ff66','#ff8844'][logo.color%5];ctx.font='bold 38px Arial';ctx.fillText('DVD',logo.x,logo.y+35);ctx.font='11px monospace';ctx.fillText('VIDEO',logo.x+37,logo.y+48);break;case'stars':ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,w,h);ctx.fillStyle='white';for(let s of stars){s.x+=(s.x-w/2)*.004*v*s.z;s.y+=(s.y-h/2)*.004*v*s.z;if(s.x<0||s.x>w||s.y<0||s.y>h){s.x=w/2+(Math.random()-.5)*25;s.y=h/2+(Math.random()-.5)*25;s.z=Math.random()+.2}ctx.fillRect(s.x,s.y,Math.max(1,s.z*2),Math.max(1,s.z*2))}break;case'pipes':if(frame%Math.max(4,16-v*2)===0){if(pipes.length===0||Math.random()<.07){pipes.push({x:Math.round(Math.random()*w/22)*22,y:Math.round(Math.random()*h/22)*22,dir:Math.floor(Math.random()*4),hue:Math.random()*360})}for(let p of pipes){if(Math.random()<.25)p.dir=(p.dir+(Math.random()<.5?1:3))%4;let ox=p.x,oy=p.y;p.x+=([1,0,-1,0][p.dir])*22;p.y+=([0,1,0,-1][p.dir])*22;if(p.x<0||p.x>w||p.y<0||p.y>h){p.x=Math.random()*w;p.y=Math.random()*h}ctx.strokeStyle=`hsl(${p.hue},90%,45%)`;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.stroke()}}break;case'toasters':ctx.fillStyle='#08082b';ctx.fillRect(0,0,w,h);for(let t of toasters){t.x-=v*.9;t.y+=Math.sin(frame*.05+t.phase)*.8;if(t.x< -90){t.x=w+Math.random()*150;t.y=Math.random()*h}ctx.save();ctx.translate(t.x,t.y);ctx.font='44px serif';ctx.fillText('🍞',0,0);ctx.fillStyle='#c5c5ff';ctx.beginPath();ctx.ellipse(7,-25,24,9,Math.sin(frame*.1)*.3,0,Math.PI*2);ctx.fill();ctx.restore()}break}}requestAnimationFrame(loop)</script></html>
